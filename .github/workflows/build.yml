name: Build

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the DLL to this existing release tag (e.g. v1.4.0.8)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build EmbyDiscover/EmbyDiscover.csproj -c Release

      - name: Check the English fallback in the browser scripts
        run: python3 tools/sync-js-fallback.py

      - name: Check the language files
        run: python3 tools/check-languages.py

      - name: Check that every page name is registered
        run: python3 tools/check-pagenames.py

      - name: Check that the browser script version matches the plugin
        run: python3 tools/check-jsversion.py

      - name: Collect plugin DLL
        run: |
          mkdir -p artifacts
          cp EmbyDiscover/bin/Release/netstandard2.0/Emby.Plugins.Discover.dll artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: Emby.Plugins.Discover
          path: artifacts/Emby.Plugins.Discover.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Emby.Plugins.Discover
      - name: Decide whether this is a pre-release
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          # The CHANGELOG decides: "## Version 1.2.3.4 (beta)" means pre-release.
          VER="${TAG#v}"; VER="${VER#V}"
          if grep -qiF "## Version $VER (beta)" CHANGELOG.md; then
            PRE=true
            echo "CHANGELOG marks $VER as beta"
          else
            # No entry at all? Then keep the setting of an existing release, else a normal release.
            if grep -qiF "## Version $VER" CHANGELOG.md; then
              PRE=false
              echo "CHANGELOG has $VER without (beta)"
            else
              PRE=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .prerelease 2>/dev/null || true)
              echo "no CHANGELOG entry for $VER; existing release says: '$PRE'"
            fi
          fi
          case "$TAG" in *beta*) PRE=true;; esac
          [ "$PRE" = true ] || PRE=false
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "pre-release: $PRE"
      - name: Take the release notes from the CHANGELOG
        id: notes
        env:
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          # Everything between this version's heading and the next one, plus the Ko-fi line.
          VER="${TAG#v}"; VER="${VER#V}"
          python3 - "$VER" <<'PY' > release-notes.md
          import re, sys
          ver = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## Version %s.*?$(.*?)(?=^## Version |\Z)' % re.escape(ver), text, re.S | re.M)
          body = (m.group(1).strip() if m else '')
          if body:
              print(body)
              print()
          print('If you like Discover, you can support it here: https://ko-fi.com/mrmuiz')
          PY
          echo "--- release notes ---"; cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: Emby.Plugins.Discover.dll
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ steps.pre.outputs.prerelease }}
          # A pre-release must never become the "latest" that the updater offers to everyone.
          make_latest: ${{ steps.pre.outputs.prerelease == 'true' && 'false' || 'true' }}
