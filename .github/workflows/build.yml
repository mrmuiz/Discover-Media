name: Build

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the DLL to this existing release tag (e.g. v1.4.0.8)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build EmbyDiscover/EmbyDiscover.csproj -c Release

      - name: Collect plugin DLL
        run: |
          mkdir -p artifacts
          cp EmbyDiscover/bin/Release/netstandard2.0/Emby.Plugins.Discover.dll artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: Emby.Plugins.Discover
          path: artifacts/Emby.Plugins.Discover.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Emby.Plugins.Discover
      - name: Keep the pre-release setting of an existing release
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          PRE=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .prerelease 2>/dev/null || true)
          case "$TAG" in *beta*) PRE=true;; esac
          [ "$PRE" = true ] || PRE=false
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "pre-release: $PRE"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: Emby.Plugins.Discover.dll
          generate_release_notes: false
          prerelease: ${{ steps.pre.outputs.prerelease }}
