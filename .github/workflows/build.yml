name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build EmbyDiscover/EmbyDiscover.csproj -c Release

      - name: Collect plugin DLL
        run: |
          mkdir -p artifacts
          cp EmbyDiscover/bin/Release/netstandard2.0/Emby.Plugins.Discover.dll artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: Emby.Plugins.Discover
          path: artifacts/Emby.Plugins.Discover.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Emby.Plugins.Discover
      - uses: softprops/action-gh-release@v2
        with:
          files: Emby.Plugins.Discover.dll
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
