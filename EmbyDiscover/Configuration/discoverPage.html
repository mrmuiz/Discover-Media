<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Discover</title>
</head>
<body>
<div data-role="page" class="page type-interior discoverUiPage" data-controller="__plugin/discoveruijs1373">
<style>
/* Header on the Discover page only (body.dcDiscoverActive is set while this page is the active route): white text and icons on the dark page. The side drawer is deliberately left alone. */
body.dcDiscoverActive .skinHeader .pageTitle,
body.dcDiscoverActive .skinHeader .headerButton,
body.dcDiscoverActive .skinHeader .headerButton .material-icons,
body.dcDiscoverActive .skinHeader .headerButton .md-icon,
body.dcDiscoverActive .skinHeader .headerButton i,
body.dcDiscoverActive .skinHeader .headerUserButton,
body.dcDiscoverActive .skinHeader .headerTabs .emby-tab-button { color:#fff !important; }
body.dcDiscoverActive .skinHeader .headerButton:hover,
body.dcDiscoverActive .skinHeader .headerButton:focus,
body.dcDiscoverActive .skinHeader .headerButton:hover .material-icons,
body.dcDiscoverActive .skinHeader .headerButton:focus .material-icons { color:#fff !important; background:rgba(255,255,255,.18); }
body.dcDiscoverActive .skinHeader .headerButton svg { fill:#fff; }
.dcRoot { padding: 5.5em 3% 4em; color: #fff; background:#0b1426; height:100vh; overflow-y:auto; box-sizing:border-box; }
@media (max-width: 800px) { .dcRoot { height:100vh; height:100dvh; padding-bottom: calc(7em + env(safe-area-inset-bottom, 0px)); } }
.dcModal, .dcModal h2, .dcModal .dcOverview { color:#fff; }
.dcSearch { display:flex; align-items:center; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:2em; padding:0 1.2em; margin-bottom:1.5em; }
.dcSearch input { flex:1; background:none; border:0; outline:0; color:#fff; font-size:1.1em; padding:.9em .5em; }
.dcRowTitle { font-size:1.5em; font-weight:600; margin:1.2em 0 .5em; }
.dcRow { display:flex; overflow-x:auto; padding:.5em .3em 1em; scrollbar-width:none; -ms-overflow-style:none; }
.dcRow::-webkit-scrollbar { display:none; }
.dcRowWrap { position:relative; }
/* Gele pijlknoppen links en rechts van een rij. Verdwijnen aan het begin/eind en als alles al in beeld past. */
.dcArrow { position:absolute; top:calc(50% - .5em); transform:translateY(-50%); z-index:3; width:2.4em; height:4.5em; border:0; border-radius:.6em; background:#ffb400; color:#111; font-size:1.2em; font-weight:700; cursor:pointer; box-shadow:0 .2em .7em rgba(0,0,0,.45); transition:opacity .15s, background .15s; }
.dcArrow:hover { background:#ffc633; }
.dcArrow.dcHide { opacity:0; pointer-events:none; }
.dcArrow.left { left:-.6em; }
.dcArrow.right { right:-.6em; }
@media (hover: none) and (pointer: coarse) { .dcArrow { display:none; } }
.dcGrid { display:flex; flex-wrap:wrap; }
.dcRow > * { margin-right:.9em; }
.dcGrid > * { margin:0 .9em .9em 0; }
.dcCard { position:relative; flex:0 0 auto; width:170px; background:none; border:0; cursor:pointer; outline:0; }
/* vaste hoogte i.p.v. aspect-ratio: aspect-ratio werkt niet op webOS 6/Chromium 79 */
.dcPoster { position:relative; width:100%; height:255px; border-radius:.7em; overflow:hidden; background:#10192b; border:2px solid transparent; transition:transform .15s, border-color .15s, box-shadow .15s; }
.dcCard:hover .dcPoster { transform:scale(1.04); border-color:#ffb400; }
.dcCard img { width:100%; height:100%; object-fit:cover; display:block; }
.dcCap { padding:.5em .15em 0; }
.dcCapT { font-size:.92em; font-weight:600; line-height:1.2; color:#eef2fb; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
.dcCapSub { margin-top:.2em; color:#9fb0cc; font-size:.8em; display:flex; align-items:center; }
.dcCapSub > * { margin-right:.5em; }
.dcCapSub .dcStar { color:#ffb400; }
.dcNoPoster { display:flex; align-items:center; justify-content:center; text-align:center; height:100%; padding:.8em; color:#aab; font-size:.95em; }
/* skeleton tijdens laden */
.dcSkelRow { display:flex; overflow:hidden; padding:.3em 0 1em; }
.dcSkelRow > * { margin-right:.9em; }
.dcSkel { flex:0 0 auto; width:170px; }
.dcSkelP { width:100%; height:255px; border-radius:.7em; background:linear-gradient(90deg,#10192b 25%,#16223a 37%,#10192b 63%); background-size:400% 100%; animation:dcShimmer 1.4s ease infinite; }
.dcSkelT { height:.75em; margin:.6em .15em 0; border-radius:.3em; background:#16223a; width:85%; }
@keyframes dcShimmer { 0%{background-position:100% 0} 100%{background-position:0 0} }
.dcBadge { position:absolute; top:.5em; left:.5em; font-size:.7em; font-weight:700; padding:.2em .6em; border-radius:1em; background:#6d28d9; }
.dcBadge.movie { background:#2563eb; }
.dcStatus { position:absolute; top:.45em; right:.45em; width:1.6em; height:1.6em; border-radius:50%; display:none; align-items:center; justify-content:center; font-size:.8em; }
.dcStatus.s1 { display:flex; background:#d99a00; }
.dcStatus.s2 { display:flex; background:#22a559; }
.dcOverlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.75); z-index:100000; display:none; align-items:center; justify-content:center; padding:1em; box-sizing:border-box; }
.dcOverlay.open { display:flex; }
.dcModal { position:relative; width:900px; max-width:100%; width:min(900px,100%); max-height:92vh; overflow:auto; -webkit-overflow-scrolling:touch; background:#0b1426; border:1px solid rgba(255,255,255,.15); border-radius:1em; }
.dcModalBack { height:220px; background-size:cover; background-position:center top; border-radius:1em 1em 0 0; position:relative; }
.dcModalBack:after { content:""; position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(transparent,#0b1426); }
.dcModalBody { display:flex; padding:0 1.6em 1.6em; margin-top:-90px; position:relative; z-index:1; }
.dcModalBody img { width:180px; height:270px; object-fit:cover; border-radius:.7em; flex:0 0 auto; background:#10192b; }
.dcModalInfo h2 { margin:.2em 0 .2em; font-size:1.8em; }
.dcMeta { color:#b8c0d4; margin-bottom:.8em; }
.dcInfo { color:#b8c0d4; font-size:.92em; line-height:1.55; margin-bottom:1em; white-space:pre-line; }
.dcOverview { line-height:1.5; color:#dfe4f1; margin-bottom:1.2em; }
.dcBtn { background:#ffb400; color:#111; border:0; border-radius:2em; padding:.8em 2em; font-weight:700; font-size:1em; cursor:pointer; }
.dcBtnRow { display:flex; flex-wrap:wrap; align-items:center; }
.dcBtnRow > * { margin:0 .7em .7em 0; }
.dcModalBody > img { margin-right:1.4em; }
/* Telefoon: de popup blijft boven Emby's onderbalk. Staat bewust NA de basisregel van .dcModal (en met .dcOverlay ervoor),
   anders wint max-height:92vh en valt de onderkant van de popup (met de Trailer-knop) achter de onderbalk. */
@media (max-width: 900px), (pointer: coarse) {
  .dcOverlay { padding-bottom: calc(1em + var(--dc-bottom-clear, calc(88px + env(safe-area-inset-bottom, 0px)))); }
  .dcOverlay .dcModal { max-height: calc(100vh - 2em - var(--dc-bottom-clear, 88px)); max-height: calc(100dvh - 2em - var(--dc-bottom-clear, 88px)); }
}
/* ---- TV (Android TV, Fire TV, webOS, Tizen): compacte popup die altijd binnen beeld blijft ----
   Tv's snijden de randen af (overscan) en Emby maakt de tekst in TV-modus groter; daarom maten in vh/vw,
   ruime marges en ingekorte tekst, zodat de knoppen onderaan altijd zichtbaar zijn. */
.dcOverlay.dcTv { padding:6vh 7vw; box-sizing:border-box; }
.dcOverlay.dcTv .dcModal { font-size:.75em; width:100%; max-width:100%; max-height:88vh; overflow:hidden; display:flex; flex-direction:column; }
.dcOverlay.dcTv .dcModalBack { position:absolute; top:0; left:0; right:0; bottom:0; height:auto; border-radius:1em; opacity:.45; }
.dcOverlay.dcTv .dcModalBack:after { background:linear-gradient(90deg,#0b1426 25%,rgba(11,20,38,.75) 60%,rgba(11,20,38,.45)); }
.dcOverlay.dcTv .dcModalBody { margin-top:0; padding:5vh 3vw 4vh; align-items:flex-start; min-height:0; max-height:88vh; box-sizing:border-box; }
.dcOverlay.dcTv .dcModalBody img { width:30vh; height:45vh; flex:0 0 auto; }
.dcOverlay.dcTv .dcModalBody > img { margin-right:2.5vw; }
.dcOverlay.dcTv .dcModalInfo { display:flex; flex-direction:column; min-width:0; flex:1 1 auto; max-height:79vh; }
.dcOverlay.dcTv .dcModalInfo h2 { font-size:1.6em; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
.dcOverlay.dcTv .dcInfo { overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; flex:0 0 auto; margin-bottom:.6em; }
.dcOverlay.dcTv .dcOverview { overflow-x:hidden; overflow-y:auto; flex:0 1 auto; min-height:3em; margin-bottom:.8em; padding-right:.6em; scroll-behavior:smooth; }
.dcOverlay.dcTv .dcOverview::-webkit-scrollbar { width:.35em; }
.dcOverlay.dcTv .dcOverview::-webkit-scrollbar-thumb { background:rgba(255,255,255,.35); border-radius:.2em; }
.dcOverlay.dcTv .dcOverview.dcMoreBelow { -webkit-mask-image:linear-gradient(180deg,#000 75%,transparent); mask-image:linear-gradient(180deg,#000 75%,transparent); }
.dcOverlay.dcTv .dcBtnRow { flex:0 0 auto; }
.dcOverlay.dcTv .dcClose { top:2vh; right:1.5vw; }
.dcTvPage .dcArrow { display:none; }
.dcTvPage .dcToast { bottom:auto; top:7vh; }
/* Op tv is Emby's kop (.skinHeader, 9.125em met de paginatitel "Discover Media") hoger dan de
   5.5em die .dcRoot standaard vrijhoudt; daardoor viel de titel over de zoekbalk. Extra ruimte boven. */
.dcTvPage .dcRoot { padding-left:5%; padding-right:5%; padding-top:9.75em; }
.dcSeasons { display:none; flex-wrap:wrap; align-items:center; margin-bottom:.4em; }
.dcSeasons.show { display:flex; }
.dcSeasons > * { margin:0 .5em .5em 0; }
.dcSeasonLabel { width:100%; color:#b8c0d4; font-size:.85em; margin-bottom:.4em; }
.dcBtnSeason { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:2em; padding:.55em 1.1em; font-weight:700; font-size:.95em; cursor:pointer; }
.dcBtnSeason:hover { background:#ffb400; color:#111; }
.dcBtnSeason.all { background:#ffb400; color:#111; border-color:#ffb400; }
.dcBtnSeason:disabled { opacity:.5; cursor:default; }
.dcBtnSeason:focus { outline:0; }
.dcBtnSeason:focus-visible { box-shadow:0 0 0 3px #ffb400; transform:scale(1.04); }
.dcTvPage .dcBtnSeason:focus { box-shadow:0 0 0 3px #ffb400; transform:scale(1.04); }
/* Telefoon: seizoenknoppen in 3 kolommen; "Alle seizoenen" gaat over de volle breedte. */
@media (max-width: 600px) {
  .dcSeasons.show { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:.5em; align-items:stretch; width:100%; }
  .dcSeasons > * { margin:0; }
  .dcBtnSeason { padding:.55em .3em; font-size:.9em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
  .dcBtnSeason.all { grid-column:1 / -1; }
  /* Knoppen (Aanvragen, Trailer, Openen in Emby, Verwijderen) over de volle breedte en vastgepind onderaan de popup,
     zodat Trailer ook bij een serie met veel seizoenen altijd in beeld is. */
  .dcModalInfo { width:100%; min-width:0; }
  .dcOverlay:not(.dcTv) .dcBtnRow { position:sticky; bottom:-1px; border-radius:0 0 1em 1em; z-index:3; display:flex; flex-wrap:wrap; gap:.5em; margin:.4em -1.6em 0; padding:.7em 1.6em; background:#0b1426; border-top:1px solid rgba(255,255,255,.12); box-shadow:0 -8px 12px -6px rgba(0,0,0,.6); }
  .dcOverlay:not(.dcTv) .dcBtnRow > * { margin:0; flex:1 1 calc(50% - .5em); min-width:0; padding:.75em .5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; box-sizing:border-box; }
  .dcOverlay:not(.dcTv) .dcBtnRow > .dcBtn { flex-basis:100%; }
}
.dcBtnDel { background:#c62828; color:#fff; border:0; border-radius:2em; padding:.8em 1.6em; font-weight:700; font-size:1em; cursor:pointer; display:none; }
.dcBtnDel.show { display:inline-block; }
.dcBtnTrailer, .dcBtnOpen { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:2em; padding:.8em 1.6em; font-weight:700; font-size:1em; cursor:pointer; display:none; }
.dcBtnTrailer.show, .dcBtnOpen.show { display:inline-block; }
.dcBtnTrailer:hover, .dcBtnOpen:hover { background:#ffb400; color:#111; }
.dcTrailerOverlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.9); z-index:10002; display:none; flex-direction:column; align-items:center; justify-content:center; padding:1em; }
.dcTrailerOverlay.open { display:flex; }
.dcTrailerFrame { width:960px; max-width:100%; height:540px; max-height:56vw; width:min(960px,100%); border:0; border-radius:.7em; background:#000; }
.dcTrailerLink { margin-top:1em; color:#ffd666; }
.dcBtnDel[disabled] { opacity:.6; cursor:default; }
.dcBtn[disabled] { background:#33415c; color:#cdd; cursor:default; }
.dcClose { position:absolute; top:.6em; right:.9em; z-index:2; background:rgba(0,0,0,.55); color:#fff; border:0; border-radius:50%; width:2.2em; height:2.2em; font-size:1.1em; cursor:pointer; }
.dcToast { position:fixed; bottom:2em; left:50%; transform:translateX(-50%); background:#22a559; color:#fff; padding:.8em 1.6em; border-radius:2em; z-index:10001; display:none; }
.dcToast.err { background:#d32f2f; }
.dcTileRow { }
.dcTile { flex:0 0 auto; width:190px; height:84px; border-radius:.7em; display:flex; align-items:center; justify-content:center; text-align:center; padding:.5em 1em; box-sizing:border-box; font-weight:700; font-size:1.05em; color:#fff; cursor:pointer; border:1px solid rgba(255,255,255,.12); transition:transform .15s, border-color .15s; overflow:hidden; }
.dcTile:hover { transform:scale(1.04); border-color:#ffb400; }
.dcTile.logo { width:150px; padding:.8em 1.2em; }
.dcTileLogo { max-width:100%; max-height:100%; object-fit:contain; filter:brightness(0) invert(1); }
.dcBrowseHead { display:flex; align-items:center; margin:1em 0 .8em; }
.dcBrowseTitle { font-size:1.6em; font-weight:600; }
.dcBrowseHead > * { margin-right:1em; }
.dcBack { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:2em; padding:.5em 1.2em; font-size:1em; cursor:pointer; }
.dcBack:hover { background:#ffb400; color:#111; }
.dcMore { text-align:center; margin:1.5em 0; }
.dcMsg { padding:2em; color:#b8c0d4; }
/* Focusrand: alleen bij navigeren met toetsenbord of afstandsbediening (:focus-visible), niet na een muisklik.
   Op tv altijd (.dcTvPage), want oudere tv-browsers (webOS 6, Chromium 79) kennen :focus-visible niet. */
.dcTile:focus, .dcBtn:focus, .dcBack:focus, .dcArrow:focus, .dcClose:focus, .dcBtnTrailer:focus, .dcBtnOpen:focus, .dcBtnDel:focus { outline:0; }
.dcTile:focus-visible, .dcBtn:focus-visible, .dcBack:focus-visible, .dcArrow:focus-visible, .dcClose:focus-visible, .dcBtnTrailer:focus-visible, .dcBtnOpen:focus-visible, .dcBtnDel:focus-visible { box-shadow:0 0 0 3px #ffb400; transform:scale(1.04); z-index:2; }
.dcTvPage .dcTile:focus, .dcTvPage .dcBtn:focus, .dcTvPage .dcBack:focus, .dcTvPage .dcClose:focus, .dcTvPage .dcBtnTrailer:focus, .dcTvPage .dcBtnOpen:focus, .dcTvPage .dcBtnDel:focus { box-shadow:0 0 0 3px #ffb400; transform:scale(1.04); z-index:2; }
/* Geselecteerde poster: dunne gele rand, 5% groter en een zachte schaduw. */
.dcCard:focus-visible .dcPoster { transform:scale(1.05); border-color:#ffb400; box-shadow:0 .5em 1.4em rgba(0,0,0,.5), 0 0 0 3px #ffb400; }
.dcCard:focus-visible .dcCapT { color:#ffb400; }
.dcTvPage .dcCard:focus .dcPoster { transform:scale(1.05); border-color:#ffb400; box-shadow:0 .5em 1.4em rgba(0,0,0,.5), 0 0 0 3px #ffb400; }
.dcTvPage .dcCard:focus .dcCapT { color:#ffb400; }
/* Downloadvoortgang (Radarr/Sonarr-wachtrij) */
.dcProg { position:absolute; left:0; right:0; bottom:0; height:5px; background:rgba(0,0,0,.6); z-index:1; }
.dcProg i { display:block; height:100%; width:0; background:#ffb400; transition:width .6s; }
.dcProg.paused i, .dcProg.stalled i { background:#9aa5b8; }
.dcCapQ { margin-top:.25em; font-size:.78em; font-weight:600; color:#ffb400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dcCapQ.paused, .dcCapQ.stalled, .dcCapQ.req { color:#c9d2ea; }
.dcCapQ.avail { color:#5fd38d; }
.dcQueue { display:none; margin:0 0 1em; }
.dcQueue.show { display:block; }
.dcQHead { font-size:.85em; color:#b8c0d4; margin-bottom:.3em; }
.dcQRow { display:flex; align-items:center; padding:.35em 0; font-size:.88em; border-top:1px solid rgba(255,255,255,.08); }
.dcQRow > * { margin-right:.7em; }
.dcQRow > *:last-child { margin-right:0; }
.dcQName { flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dcQBar { flex:0 0 7em; height:6px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; }
.dcQBar i { display:block; height:100%; background:#ffb400; }
.dcQBar.paused i, .dcQBar.stalled i { background:#9aa5b8; }
.dcQPct { flex:0 0 auto; min-width:7.5em; text-align:right; color:#b8c0d4; white-space:nowrap; }
.dcQRel { font-size:.75em; color:#8a96ad; word-break:break-all; padding:0 0 .35em; }
.dcQMore { font-size:.8em; color:#8a96ad; padding-top:.3em; }
@media (max-width:600px) { .dcQBar { flex-basis:3.5em; } .dcQPct { min-width:0; } }
@media (max-width:600px){ .dcCard{width:130px;} .dcPoster{height:195px;} .dcSkel{width:130px;} .dcSkelP{height:195px;} .dcModalBody{flex-direction:column; align-items:center;} }
@media (prefers-reduced-motion: reduce){ .dcSkelP{animation:none} }
</style>
    <div class="dcRoot">
        <div class="dcDiag" style="margin:0 0 1em;font-size:.85em;opacity:.8;white-space:pre-wrap;color:#ffd666;"></div>
        <div class="dcSearch">
            <button type="button" class="dcBack dcChannelBtn" style="margin-right:1em;white-space:nowrap;">Kanaaltegels</button>
            <span>&#128269;</span>
            <input type="text" class="dcSearchInput" placeholder="Films en series zoeken" autocomplete="off" />
        </div>
        <div class="dcContent"><div class="dcMsg">Laden...</div></div>
    </div>

    <div class="dcOverlay">
        <div class="dcModal">
            <button type="button" class="dcClose">&#10005;</button>
            <div class="dcModalBack"></div>
            <div class="dcModalBody">
                <img class="dcModalPoster" alt="" />
                <div class="dcModalInfo">
                    <h2 class="dcModalTitle"></h2>
                    <div class="dcMeta"></div>
                    <div class="dcInfo"></div>
                    <div class="dcOverview"></div>
                    <div class="dcQueue"></div>
                    <div class="dcSeasons"></div>
                    <div class="dcBtnRow"><button type="button" class="dcBtn"></button><button type="button" class="dcBtnTrailer"></button><button type="button" class="dcBtnOpen"></button><button type="button" class="dcBtnDel"></button></div>
                </div>
            </div>
        </div>
    </div>
    <div class="dcTrailerOverlay">
        <button type="button" class="dcClose dcTrailerClose">&#10005;</button>
        <iframe class="dcTrailerFrame" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        <a class="dcTrailerLink" target="_blank" rel="noopener"></a>
    </div>
    <div class="dcToast"></div>
</div>
