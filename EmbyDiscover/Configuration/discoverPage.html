    align-items:center;
    justify-content:space-between;
    padding:18px 22px 6px
}
.dcPkHead h3{
    margin:0;
    font-size:19px;
    font-weight:700;
    color:#fff
}
.dcPkX{
    border:0;
    background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.75);
    cursor:pointer;
    width:32px;
    height:32px;
    border-radius:50%;
    font-size:14px;
    line-height:1
}
.dcPkX:hover{
    background:rgba(255,255,255,.18);
    color:#fff
}
.dcPkList{
    overflow-y:auto;
    padding:12px 22px 14px;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px
}
.dcPkOpt{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    background:rgba(255,255,255,.045);
    cursor:pointer;
    transition:background .15s,border-color .15s,transform .15s
}
.dcPkOpt:hover{
    background:rgba(255,255,255,.09);
    transform:translateY(-1px)
}
.dcPkOpt.on{
    border-color:var(--dc-accent,#ffb400);
    background:rgba(var(--dc-accent-rgb,255,180,0),.14)
}
.dcPkOpt input{
    position:absolute;
    opacity:0;
    pointer-events:none;
    width:1px;
    height:1px
}
.dcPkChk{
    flex:0 0 auto;
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:800;
    color:transparent;
    box-sizing:border-box;
    transition:background .15s,border-color .15s
}
.dcPkChk:after{
    content:"\2713"
}
.dcPkOpt.on .dcPkChk{
    background:var(--dc-accent,#ffb400);
    border-color:var(--dc-accent,#ffb400);
    color:var(--dc-accent-text,#111)
}
.dcPkOpt input:focus-visible + .dcPkChk{
    box-shadow:0 0 0 3px rgba(255,255,255,.5)
}
.dcPkAll{
    grid-column:1/-1;
    font-weight:700
}
.dcPkLbl{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:15px;
    font-weight:700
}
.dcPkEp{
    font-size:12px;
    font-weight:500;
    color:rgba(255,255,255,.6)
}
.dcPkTag{
    flex:0 0 auto;
    white-space:nowrap;
    padding:2px 8px;
    border-radius:9999px;
    background:rgba(34,165,89,.22);
    color:#6fe3a0;
    font-size:10px;
    font-weight:700
}
.dcPkFoot{
    padding:12px 22px 20px
}
.dcPkGo{
    display:block;
    width:100%;
    padding:13px 16px;
    border:0;
    border-radius:14px;
    background:var(--dc-accent,#ffb400);
    color:var(--dc-accent-text,#111);
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:filter .15s,transform .15s
}
.dcPkGo:hover:not(:disabled){
    filter:brightness(1.1);
    transform:translateY(-1px)
}
.dcPkGo:disabled{
    opacity:.35;
    cursor:not-allowed
}
@media (max-width:480px){
    .dcPkList{
    grid-template-columns:1fr
}

}
