<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Discover</title>
</head>
<body>
<div data-role="page" class="page type-interior discoverUiPage" data-controller="__plugin/discoveruijs">
<style>
.dcRoot { padding: 5.5em 3% 4em; color: #fff; background:#0b1426; height:100vh; overflow-y:auto; box-sizing:border-box; }
.dcModal, .dcModal h2, .dcModal .dcOverview { color:#fff; }
.dcSearch { display:flex; align-items:center; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:2em; padding:0 1.2em; margin-bottom:1.5em; }
.dcSearch input { flex:1; background:none; border:0; outline:0; color:#fff; font-size:1.1em; padding:.9em .5em; }
.dcRowTitle { font-size:1.5em; font-weight:600; margin:1.2em 0 .5em; }
.dcRow { display:flex; gap:.9em; overflow-x:auto; padding:.3em 0 1em; scrollbar-width:thin; }
.dcRowWrap { position:relative; }
.dcArrow { position:absolute; top:calc(50% - .5em); transform:translateY(-50%); z-index:3; width:2.4em; height:4.5em; border:0; border-radius:.6em; background:rgba(0,0,0,.7); color:#fff; font-size:1.2em; cursor:pointer; opacity:.85; }
.dcArrow:hover { background:#ffb400; color:#111; opacity:1; }
.dcArrow.left { left:-.6em; }
.dcArrow.right { right:-.6em; }
.dcGrid { display:flex; flex-wrap:wrap; gap:.9em; }
.dcCard { position:relative; flex:0 0 auto; width:170px; aspect-ratio:2/3; border-radius:.7em; overflow:hidden; background:#10192b; border:1px solid rgba(255,255,255,.12); cursor:pointer; transition:transform .15s; }
.dcCard:hover { transform:scale(1.04); border-color:#ffb400; }
.dcCard img { width:100%; height:100%; object-fit:cover; display:block; }
.dcNoPoster { display:flex; align-items:center; justify-content:center; text-align:center; height:100%; padding:.8em; color:#aab; font-size:.95em; }
.dcBadge { position:absolute; top:.5em; left:.5em; font-size:.7em; font-weight:700; padding:.2em .6em; border-radius:1em; background:#6d28d9; }
.dcBadge.movie { background:#2563eb; }
.dcStatus { position:absolute; top:.45em; right:.45em; width:1.6em; height:1.6em; border-radius:50%; display:none; align-items:center; justify-content:center; font-size:.8em; }
.dcStatus.s1 { display:flex; background:#d99a00; }
.dcStatus.s2 { display:flex; background:#22a559; }
.dcOverlay { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:10000; display:none; align-items:center; justify-content:center; padding:1em; }
.dcOverlay.open { display:flex; }
.dcModal { position:relative; width:min(900px,100%); max-height:92vh; overflow:auto; background:#0b1426; border:1px solid rgba(255,255,255,.15); border-radius:1em; }
.dcModalBack { height:220px; background-size:cover; background-position:center top; border-radius:1em 1em 0 0; position:relative; }
.dcModalBack:after { content:""; position:absolute; inset:0; background:linear-gradient(transparent,#0b1426); }
.dcModalBody { display:flex; gap:1.4em; padding:0 1.6em 1.6em; margin-top:-90px; position:relative; z-index:1; }
.dcModalBody img { width:180px; height:270px; object-fit:cover; border-radius:.7em; flex:0 0 auto; background:#10192b; }
.dcModalInfo h2 { margin:.2em 0 .2em; font-size:1.8em; }
.dcMeta { color:#b8c0d4; margin-bottom:.8em; }
.dcInfo { color:#b8c0d4; font-size:.92em; line-height:1.55; margin-bottom:1em; white-space:pre-line; }
.dcOverview { line-height:1.5; color:#dfe4f1; margin-bottom:1.2em; }
.dcBtn { background:#ffb400; color:#111; border:0; border-radius:2em; padding:.8em 2em; font-weight:700; font-size:1em; cursor:pointer; }
.dcBtnRow { display:flex; gap:.7em; flex-wrap:wrap; align-items:center; }
.dcBtnDel { background:#c62828; color:#fff; border:0; border-radius:2em; padding:.8em 1.6em; font-weight:700; font-size:1em; cursor:pointer; display:none; }
.dcBtnDel.show { display:inline-block; }
.dcBtnDel[disabled] { opacity:.6; cursor:default; }
.dcBtn[disabled] { background:#33415c; color:#cdd; cursor:default; }
.dcClose { position:absolute; top:.6em; right:.9em; z-index:2; background:rgba(0,0,0,.55); color:#fff; border:0; border-radius:50%; width:2.2em; height:2.2em; font-size:1.1em; cursor:pointer; }
.dcToast { position:fixed; bottom:2em; left:50%; transform:translateX(-50%); background:#22a559; color:#fff; padding:.8em 1.6em; border-radius:2em; z-index:10001; display:none; }
.dcToast.err { background:#d32f2f; }
.dcTileRow { gap:.9em; }
.dcTile { flex:0 0 auto; width:190px; height:84px; border-radius:.7em; display:flex; align-items:center; justify-content:center; text-align:center; padding:.5em 1em; box-sizing:border-box; font-weight:700; font-size:1.05em; color:#fff; cursor:pointer; border:1px solid rgba(255,255,255,.12); transition:transform .15s, border-color .15s; overflow:hidden; }
.dcTile:hover { transform:scale(1.04); border-color:#ffb400; }
.dcTile.logo { width:150px; padding:.8em 1.2em; }
.dcTileLogo { max-width:100%; max-height:100%; object-fit:contain; filter:brightness(0) invert(1); }
.dcBrowseHead { display:flex; align-items:center; gap:1em; margin:1em 0 .8em; }
.dcBrowseTitle { font-size:1.6em; font-weight:600; }
.dcBack { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:2em; padding:.5em 1.2em; font-size:1em; cursor:pointer; }
.dcBack:hover { background:#ffb400; color:#111; }
.dcMore { text-align:center; margin:1.5em 0; }
.dcMsg { padding:2em; color:#b8c0d4; }
@media (max-width:600px){ .dcCard{width:130px;} .dcModalBody{flex-direction:column; align-items:center;} }
</style>
    <div class="dcRoot">
        <div class="dcDiag" style="margin:0 0 1em;font-size:.85em;opacity:.8;white-space:pre-wrap;color:#ffd666;"></div>
        <div class="dcSearch">
            <span>&#128269;</span>
            <input type="text" class="dcSearchInput" placeholder="Films en series zoeken" autocomplete="off" />
        </div>
        <div class="dcContent"><div class="dcMsg">Laden...</div></div>
    </div>

    <div class="dcOverlay">
        <div class="dcModal">
            <button type="button" class="dcClose">&#10005;</button>
            <div class="dcModalBack"></div>
            <div class="dcModalBody">
                <img class="dcModalPoster" alt="" />
                <div class="dcModalInfo">
                    <h2 class="dcModalTitle"></h2>
                    <div class="dcMeta"></div>
                    <div class="dcInfo"></div>
                    <div class="dcOverview"></div>
                    <div class="dcBtnRow"><button type="button" class="dcBtn"></button><button type="button" class="dcBtnDel"></button></div>
                </div>
            </div>
        </div>
    </div>
    <div class="dcToast"></div>
</div>
</body>
</html>
