<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Discover status</title>
</head>
<body>
<div data-role="page" class="page type-interior pluginConfigurationPage discoverStatusPage" data-require="emby-button" data-controller="__plugin/discoverstatusjs1109">
    <div data-role="content">
        <div class="content-primary">
            <h2>Discover status</h2>
            <p class="fieldDescription">
                Checks everything Discover needs: the plugin, channel, TMDB, Radarr, Sonarr, and clip file. Run this on each server and compare the results. API keys are never shown.
                Draai dit op elke server en vergelijk de uitkomst. Er worden geen API keys getoond.
            </p>
            <div>
                <button is="emby-button" type="button" class="raised dsRefresh"><span>Check again</span></button>
                <button is="emby-button" type="button" class="raised dsCopy"><span>Copy report</span></button>
            </div>
            <pre class="dsOut" style="margin-top:1em; white-space:pre-wrap; word-break:break-word; user-select:text;"></pre>
        </div>
    </div>
</div>
</body>
</html>
